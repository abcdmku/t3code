<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 344" width="960" height="344" role="img">
  <rect width="960" height="344" fill="#ffffff"/>
  <rect x="420" y="40" width="500" height="280" rx="16" fill="none" stroke="#d1d9e0" stroke-width="1.25"/>
  <text x="444" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#59636e">T3 Code</text>

  <rect x="448" y="80" width="444" height="104" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.25"/>
  <text x="670" y="106" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">T3 client</text>
  <text x="670" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e">desktop or web</text>
  <rect x="470" y="130" width="400" height="38" rx="8" fill="#8250df" fill-opacity="0.05" stroke="#8250df" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="670" y="154" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2328">your page renders in this surface</text>

  <rect x="448" y="216" width="444" height="72" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.25"/>
  <text x="670" y="242" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">T3 server</text>
  <text x="670" y="261" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e">HTTP and WebSocket</text>

  <rect x="40" y="80" width="230" height="208" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.25"/>
  <text x="155" y="171" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">Your app</text>
  <text x="155" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e">serves the plugin page</text>
  <text x="155" y="207" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e">optional MCP endpoint</text>

  <line x1="270" y1="149" x2="440" y2="149" stroke="#8250df" stroke-width="1.75"/>
  <polygon points="448,149 440,144.5 440,153.5" fill="#8250df"/>

  <text x="359" y="121" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8250df">T3 loads your URL</text>

  <text x="359" y="139" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636e">{threadId} and a one-time code</text>

  <line x1="448" y1="240" x2="278" y2="240" stroke="#0f7b6c" stroke-width="1.75"/>
  <polygon points="270,240 278,235.5 278,244.5" fill="#0f7b6c"/>

  <text x="359" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636e">optional MCP calls</text>

  <text x="359" y="228" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636e">from agent sessions</text>

  <line x1="270" y1="272" x2="440" y2="272" stroke="#0969da" stroke-width="1.75"/>
  <polygon points="448,272 440,267.5 440,276.5" fill="#0969da"/>

  <text x="359" y="294" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0969da">your page calls T3</text>

  <text x="359" y="312" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636e">read, dispatch, subscribe</text>
