<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img">
  <rect width="960" height="400" fill="#ffffff"/>

  <rect x="64" y="52" width="250" height="62" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.25"/>
  <text x="189" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">Local app</text>
  <text x="189" y="97" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e">your own process</text>

  <rect x="646" y="52" width="250" height="62" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.25"/>
  <text x="771" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">T3 server</text>
  <text x="771" y="97" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e">HTTP and WebSocket</text>

  <rect x="64" y="214" width="250" height="62" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.25"/>
  <text x="189" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">Local app UI</text>
  <text x="189" y="259" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e">the page T3 embeds</text>

  <rect x="646" y="214" width="250" height="62" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.25"/>
  <text x="771" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">T3 client</text>
  <text x="771" y="259" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e">desktop or web</text>

  <line x1="314" y1="83" x2="638" y2="83" stroke="#0969da" stroke-width="1.75"/>
  <polygon points="646,83 638,78.5 638,87.5" fill="#0969da"/>

  <text x="480" y="46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#1f2328"><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#0969da" font-weight="700">1</tspan>  @t3tools/sdk</text>

  <text x="480" y="64" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e">snapshots, dispatch, resumable subscribe</text>

  <line x1="771" y1="114" x2="771" y2="206" stroke="#0969da" stroke-width="1.75"/>
  <polygon points="771,214 766.5,206 775.5,206" fill="#0969da"/>

  <text x="788" y="152" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#1f2328"><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#0969da" font-weight="700">1</tspan>  ui.revealThread</text>

  <text x="788" y="170" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e">to the focused client</text>

  <line x1="646" y1="245" x2="322" y2="245" stroke="#8250df" stroke-width="1.75"/>
  <polygon points="314,245 322,240.5 322,249.5" fill="#8250df"/>

  <text x="480" y="268" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328"><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#8250df" font-weight="700">2</tspan>  Add plugin</text>

  <text x="480" y="286" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e">T3 opens the saved URL as a browser surface</text>
  <line x1="189" y1="276" x2="189" y2="318" stroke="#0f7b6c" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="771" y1="276" x2="771" y2="318" stroke="#0f7b6c" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="64" y="318" width="832" height="54" rx="12" fill="#0f7b6c" fill-opacity="0.06" stroke="#0f7b6c" stroke-width="1.25" stroke-dasharray="6 4"/>

  <text x="480" y="342" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#1f2328"><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#0f7b6c" font-weight="700">3</tspan>  @t3tools/ui + theme.css</text>

  <text x="480" y="360" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e">nice to have, the same components on both sides</text>
</svg>
