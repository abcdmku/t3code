<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img">
  <rect width="960" height="360" fill="#0d1117"/>
  <rect x="420" y="40" width="500" height="280" rx="16" fill="none" stroke="#3d444d" stroke-width="1.25"/>
  <text x="444" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#9198a1">T3 Code</text>

  <rect x="448" y="80" width="444" height="104" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.25"/>
  <text x="670" y="106" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3">T3 client</text>
  <text x="670" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#9198a1">desktop or web</text>
  <rect x="470" y="130" width="400" height="38" rx="8" fill="#b083f0" fill-opacity="0.12" stroke="#b083f0" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="670" y="154" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#e6edf3">your page renders in this surface</text>

  <rect x="448" y="216" width="444" height="72" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.25"/>
  <text x="670" y="242" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3">T3 server</text>
  <text x="670" y="261" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#9198a1">HTTP and WebSocket</text>

  <rect x="40" y="104" width="230" height="92" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.25"/>
  <text x="155" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3">Your app</text>
  <text x="155" y="151" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#9198a1">serves the plugin page</text>
  <text x="155" y="168" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#9198a1">optional MCP endpoint</text>

  <line x1="270" y1="149" x2="440" y2="149" stroke="#b083f0" stroke-width="1.75"/>
  <polygon points="448,149 440,144.5 440,153.5" fill="#b083f0"/>

  <text x="359" y="121" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b083f0">T3 loads your URL</text>

  <text x="359" y="139" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#9198a1">{threadId} and a one-time code</text>

  <polyline points="155,196 155,252 440,252" fill="none" stroke="#4493f8" stroke-width="1.75"/>
  <polygon points="448,252 440,247.5 440,256.5" fill="#4493f8"/>

  <text x="312" y="226" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#4493f8">your page calls T3</text>

  <text x="312" y="244" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#9198a1">read, dispatch, subscribe</text>

  <polyline points="670,288 670,332 230,332 230,204" fill="none" stroke="#39c5bb" stroke-width="1.75"/>
  <polygon points="230,196 225.5,204 234.5,204" fill="#39c5bb"/>

  <text x="456" y="314" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#9198a1">optional MCP calls from agent sessions</text>
