<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">T3 SDK request and UI reveal flow</title>
  <desc id="desc">A sequence diagram with lanes for a local integration, the T3 SDK, the T3 server, and an open T3 client. It shows snapshot reads, thread commands, event streaming, and a reveal-thread request.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --lane: #f8fafc;
      --header: #eef2ff;
      --border: #cbd5e1;
      --grid: #94a3b8;
      --text: #0f172a;
      --muted: #475569;
      --request: #2563eb;
      --response: #047857;
      --reveal: #7c3aed;
      --note: #f1f5f9;
      --note-border: #94a3b8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f14;
        --lane: #111827;
        --header: #172554;
        --border: #334155;
        --grid: #64748b;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --request: #60a5fa;
        --response: #34d399;
        --reveal: #c4b5fd;
        --note: #1e293b;
        --note-border: #64748b;
      }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--text); }
    .bg { fill: var(--bg); }
    .lane { fill: var(--lane); stroke: var(--border); stroke-width: 1; }
    .lane-header { fill: var(--header); stroke: var(--border); stroke-width: 1; }
    .title { font-size: 24px; font-weight: 600; }
    .subtitle { font-size: 15px; fill: var(--muted); }
    .lane-title { font-size: 17px; font-weight: 600; text-anchor: middle; }
    .lane-subtitle { font-size: 13px; fill: var(--muted); text-anchor: middle; }
    .lifeline { stroke: var(--grid); stroke-width: 1.5; stroke-dasharray: 5 7; }
    .request { stroke: var(--request); fill: none; stroke-width: 2.5; marker-end: url(#request-arrow); }
    .response { stroke: var(--response); fill: none; stroke-width: 2.5; marker-end: url(#response-arrow); }
    .reveal { stroke: var(--reveal); fill: none; stroke-width: 2.5; marker-end: url(#reveal-arrow); }
    .event-label { font-size: 15px; font-weight: 600; text-anchor: middle; }
    .event-detail { font-size: 13px; fill: var(--muted); text-anchor: middle; }
    .request-label { fill: var(--request); }
    .response-label { fill: var(--response); }
    .reveal-label { fill: var(--reveal); }
    .note { fill: var(--note); stroke: var(--note-border); stroke-width: 1; }
    .note-title { font-size: 14px; font-weight: 600; text-anchor: middle; }
    .note-text { font-size: 12px; fill: var(--muted); text-anchor: middle; }
    .step { fill: var(--bg); stroke: var(--border); stroke-width: 1; }
    .step-number { font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
  </style>
  <defs>
    <marker id="request-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="var(--request)" />
    </marker>
    <marker id="response-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="var(--response)" />
    </marker>
    <marker id="reveal-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="var(--reveal)" />
    </marker>
  </defs>

  <rect class="bg" width="1200" height="690" />
  <text class="title" x="28" y="36">SDK requests and UI reveal</text>
  <text class="subtitle" x="28" y="62">The integration stays separate. The SDK owns transport and decoding. The server owns authorization and routing.</text>

  <rect class="lane" x="20" y="86" width="270" height="574" rx="10" />
  <rect class="lane" x="310" y="86" width="270" height="574" rx="10" />
  <rect class="lane" x="600" y="86" width="270" height="574" rx="10" />
  <rect class="lane" x="890" y="86" width="290" height="574" rx="10" />

  <rect class="lane-header" x="20" y="86" width="270" height="68" rx="10" />
  <rect class="lane-header" x="310" y="86" width="270" height="68" rx="10" />
  <rect class="lane-header" x="600" y="86" width="270" height="68" rx="10" />
  <rect class="lane-header" x="890" y="86" width="290" height="68" rx="10" />

  <text class="lane-title" x="155" y="114">Local integration</text>
  <text class="lane-subtitle" x="155" y="136">CLI, app, or automation</text>
  <text class="lane-title" x="445" y="114">T3 SDK</text>
  <text class="lane-subtitle" x="445" y="136">Promise or Effect client</text>
  <text class="lane-title" x="735" y="114">T3 server</text>
  <text class="lane-subtitle" x="735" y="136">Auth, state, and broker</text>
  <text class="lane-title" x="1035" y="114">Open T3 client</text>
  <text class="lane-subtitle" x="1035" y="136">Web or desktop host</text>

  <line class="lifeline" x1="155" y1="154" x2="155" y2="612" />
  <line class="lifeline" x1="445" y1="154" x2="445" y2="612" />
  <line class="lifeline" x1="735" y1="154" x2="735" y2="612" />
  <line class="lifeline" x1="1035" y1="154" x2="1035" y2="612" />

  <circle class="step" cx="45" cy="190" r="14" />
  <text class="step-number" x="45" y="190">1</text>
  <line class="request" x1="155" y1="190" x2="435" y2="190" />
  <text class="event-label request-label" x="300" y="177">createT3Client(config)</text>
  <text class="event-detail" x="300" y="211">server URL, token or pairing credential</text>

  <circle class="step" cx="45" cy="270" r="14" />
  <text class="step-number" x="45" y="270">2</text>
  <line class="request" x1="445" y1="250" x2="725" y2="250" />
  <text class="event-label request-label" x="590" y="237">descriptor() and shell()</text>
  <line class="response" x1="735" y1="290" x2="455" y2="290" />
  <text class="event-label response-label" x="590" y="315">capabilities and snapshots</text>

  <circle class="step" cx="45" cy="385" r="14" />
  <text class="step-number" x="45" y="385">3</text>
  <line class="request" x1="155" y1="350" x2="435" y2="350" />
  <text class="event-label request-label" x="300" y="337">createThread() or startTurn()</text>
  <line class="request" x1="445" y1="385" x2="725" y2="385" />
  <text class="event-label request-label" x="590" y="372">typed command</text>
  <line class="response" x1="735" y1="425" x2="165" y2="425" />
  <text class="event-label response-label" x="445" y="450">receipt and resumable event stream</text>

  <circle class="step" cx="45" cy="525" r="14" />
  <text class="step-number" x="45" y="525">4</text>
  <line class="reveal" x1="155" y1="490" x2="435" y2="490" />
  <text class="event-label reveal-label" x="300" y="477">revealThread(threadId)</text>
  <line class="reveal" x1="445" y1="525" x2="725" y2="525" />
  <text class="event-label reveal-label" x="590" y="512">capability-gated invoke</text>
  <line class="reveal" x1="735" y1="560" x2="1025" y2="560" />
  <text class="event-label reveal-label" x="880" y="547">brokered UI request</text>
  <line class="response" x1="1035" y1="595" x2="165" y2="595" />
  <text class="event-label response-label" x="600" y="620">delivered result after navigate and optional desktop raise</text>

  <rect class="note" x="39" y="630" width="232" height="45" rx="7" />
  <text class="note-title" x="155" y="650">Separate process</text>
  <text class="note-text" x="155" y="666">No code loads inside T3</text>
  <rect class="note" x="329" y="630" width="232" height="45" rx="7" />
  <text class="note-title" x="445" y="650">Stable operations</text>
  <text class="note-text" x="445" y="666">Raw dispatch stays unstable</text>
  <rect class="note" x="619" y="630" width="232" height="45" rx="7" />
  <text class="note-title" x="735" y="650">Scoped and bounded</text>
  <text class="note-text" x="735" y="666">Auth, timeouts, cleanup</text>
  <rect class="note" x="909" y="630" width="252" height="45" rx="7" />
  <text class="note-title" x="1035" y="650">Capability registered</text>
  <text class="note-text" x="1035" y="666">Old clients stay compatible</text>
</svg>
