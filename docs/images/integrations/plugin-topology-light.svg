<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 384" width="960" height="384" role="img">
  <rect width="960" height="384" fill="#ffffff"/>
  <rect x="300" y="32" width="360" height="140" rx="14" fill="none" stroke="#d1d9e0" stroke-width="1.25"/>
  <text x="480" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#59636e">T3 client, desktop or web</text>

  <rect x="322" y="74" width="316" height="76" rx="10" fill="#8250df" fill-opacity="0.05" stroke="#8250df" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="480" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">plugin page</text>
  <text x="480" y="119" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e">your URL, inside T3's browser surface</text>

  <rect x="40" y="250" width="270" height="64" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.25"/>
  <text x="175" y="276" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">Your app</text>
  <text x="175" y="295" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e">serves that page, optional MCP</text>

  <rect x="650" y="250" width="270" height="64" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.25"/>
  <text x="785" y="276" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">T3 server</text>
  <text x="785" y="295" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e">HTTP and WebSocket</text>

  <polyline points="300,112 175,112 175,242" fill="none" stroke="#8250df" stroke-width="1.75"/>
  <polygon points="175,250 170.5,242 179.5,242" fill="#8250df"/>

  <text x="165" y="182" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8250df">T3 opens your URL</text>

  <text x="165" y="200" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636e">with {threadId} and</text>

  <text x="165" y="216" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636e">a one-time code</text>

  <polyline points="660,112 785,112 785,242" fill="none" stroke="#0969da" stroke-width="1.75"/>
  <polygon points="785,250 780.5,242 789.5,242" fill="#0969da"/>

  <text x="795" y="182" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0969da">the page calls T3 directly</text>

  <text x="795" y="200" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636e">exchange the code, then</text>

  <text x="795" y="216" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636e">read, dispatch, subscribe</text>

  <polyline points="785,314 785,352 175,352 175,322" fill="none" stroke="#0f7b6c" stroke-width="1.75"/>
  <polygon points="175,314 170.5,322 179.5,322" fill="#0f7b6c"/>

  <text x="480" y="344" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#59636e">optional MCP calls from agent sessions</text>
</svg>
